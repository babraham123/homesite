<!-- ref: https://isso-comments.de/docs/reference/client-config/ -->
<!-- ref: https://github.com/squidfunk/mkdocs-material/issues/1466 -->
{% if page.meta.comments %}
  <h2 id="__comments">{{ lang.t("meta.comments") }}</h2>
  <script data-isso-css="true"
    data-isso-lang="en"
    data-isso-max-comments-top="10"
    data-isso-max-comments-nested="5"
    data-isso-reveal-on-click="5"
    data-isso-sorting="newest"
    data-isso-avatar="true"
    data-isso-avatar-bg="#f0f0f0"
    data-isso-avatar-fg="#9abf88 #5698c4 #e279a3 #9163b6 #be5168 #f19670 #e4bf80 #447c69"
    data-isso-vote="true"
    data-isso-vote-levels="null"
    data-isso-reply-notifications-default-enabled="false"
    src="https://comment.bket.net/js/embed.min.js">
  </script>
  {# Isso's container can't fetch the page to read its title, so the first comment sends it. #}
  <section id="isso-thread" data-title="{{ page.title | striptags }}">
    <noscript>Enable JavaScript to view comments.</noscript>
  </section>
