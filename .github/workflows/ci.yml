name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The Python the local .venv is built with.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      # The social plugin renders cards through cairo.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2
      # tools/mkdocs.sh runs mkdocs from .venv.
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      # Checked against the sha256 file of the same release.
      - env:
          # renovate: datasource=github-releases depName=lycheeverse/lychee
          LYCHEE_VERSION: 0.24.2
        run: |
          cd "$RUNNER_TEMP"
          tarball=lychee-x86_64-unknown-linux-gnu.tar.gz
          url="https://github.com/lycheeverse/lychee/releases/download/lychee-v$LYCHEE_VERSION/$tarball"
          curl -fsSLO "$url" -O "$url.sha256"
          sha256sum --check "$tarball.sha256"
          tar xzf "$tarball"
          sudo install -t /usr/local/bin lychee-x86_64-unknown-linux-gnu/lychee
      # The strict build and the offline link and anchor check, as on every commit.
      - run: .githooks/pre-commit
